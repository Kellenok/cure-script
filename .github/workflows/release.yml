name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - config/.vitepress/**

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          chmod +x epublish
          ./epublish

      - name: Create release & upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
          files: |
            **/*.epub
